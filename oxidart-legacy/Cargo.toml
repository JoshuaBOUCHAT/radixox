[package]
name = "oxidart-legacy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Ancien OxidArt (nœuds 64 o), gardé comme oracle des tests différentiels du nouvel arbre. Non publié."
keywords = ["art", "radix-tree", "trie", "data-structure", "ttl"]
categories = ["data-structures"]

publish = false

[dependencies]
bytes.workspace = true
smallvec = "1.15.1"
ordered-float = "5.1.0"
radixox-lib = { workspace = true, features = ["std"] }
valart = { workspace = true, features = ["std"] }

rand = "0.8"
crc32fast = "1.4"
regex-automata = { version = "0.4", optional = true, default-features = false, features = [
    "dfa-build",
    "dfa-search",
    "syntax",
] }
hashbrown = "0.17.0"
zstd-safe = { version = "8.1", default-features = false, features = ["experimental", "std"] }

[features]
regex = ["dep:regex-automata"]
