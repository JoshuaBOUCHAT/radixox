[workspace]
resolver = "2"
members = ["radixox", "oxidart", "oxidart-legacy", "radixox-lib", "valart"]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Joshua"]
license = "MIT"
repository = "https://github.com/JoshuaBOUCHAT/radixox"

[workspace.dependencies]
bytes = { version = "1", features = ["serde"] }
oxidart = { path = "oxidart", version = "0.6.0" }
radixox-lib = { path = "radixox-lib", version = "0.6.0" }
valart = { path = "valart", version = "0.6.0" }
smallvec = "1.15.1"


[profile.profiling]
inherits = "release"
strip = false
debug = true

[profile.lto]
inherits = "release"
lto = true
debug = false
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# hislab 0.2.6 (touched_bytes) pas encore publié : dépôt local voisin.
[patch.crates-io]
hislab = { path = "../hislab" }
