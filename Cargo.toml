[workspace]
resolver = "2"
members = ["radixox", "oxidart", "oxidart-legacy", "radixox-lib", "radixox-mem", "valart"]
# `cargo build` / `cargo test` sans `-p` : sans oxidart-legacy (oracle des tests différentiels,
# tiré en dépendance de dev par oxidart ; `--workspace` pour l'inclure).
default-members = ["radixox", "oxidart", "radixox-lib", "radixox-mem", "valart"]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Joshua"]
license = "MIT"
repository = "https://github.com/JoshuaBOUCHAT/radixox"

[workspace.dependencies]
bytes = "1"
oxidart = { path = "oxidart", version = "0.6.0" }
# Sans `std` par défaut (no_std) : chaque crate active `radixox-lib/std` elle-même.
radixox-lib = { path = "radixox-lib", version = "0.6.0", default-features = false }
valart = { path = "valart", version = "0.6.0", default-features = false }


[profile.profiling]
inherits = "release"
strip = false
debug = true

[profile.lto]
inherits = "release"
lto = true
debug = false
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
