[package]
name = "oxidart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory ordered key-value engine: adaptive radix tree with TTL, prefix/range/glob queries, Redis value types and fork-free snapshots"
readme = "README.md"
keywords = ["art", "radix-tree", "trie", "data-structure", "ttl"]
categories = ["data-structures"]

[dependencies]
zmij = "1.0"
radixox-lib = { workspace = true }
valart = { workspace = true }

crc32fast = { version = "1.4", default-features = false }
regex-automata = { version = "0.4", optional = true, default-features = false, features = [
    "dfa-build",
    "dfa-search",
    "syntax",
] }
hashbrown = "0.17.0"
# Compression du dump : du C (il lui faut malloc / free / memcpy, que le binaire fournit).
zstd-safe = { version = "8.1", default-features = false, features = ["experimental"], optional = true }

[features]
# Processus `std` (défaut) : lecture de tout `std::io::Read`, compression zstd du dump.
# Sans elle, oxidart est `no_std` + `alloc` (save dans un `Vec`, reload depuis une
# tranche ou une `Source` de l'appelant).
default = ["std"]
std = ["radixox-lib/std", "valart/std", "crc32fast/std", "zstd"]
# Compression zstd du dump (`compress`), sans `std` possible.
zstd = ["dep:zstd-safe"]
regex = ["dep:regex-automata"]
# Voir radixox-lib : compteurs d'accès pour LRU / LFU.
eviction = ["radixox-lib/eviction"]

[dev-dependencies]
rand = "0.8"
# Ancien arbre, oracle des tests différentiels (retiré à la publication).
oxidart-legacy = { path = "../oxidart-legacy", features = ["regex"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(radixox_nopool)', 'cfg(radixox_sysalloc)', 'cfg(radixox_list128)', 'cfg(radixox_list512)'] }
