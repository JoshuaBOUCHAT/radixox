[package]
name = "oxidart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance Adaptive Radix Tree with TTL, DFA pattern matching, and atomic counters"
readme = "README.md"
keywords = ["art", "radix-tree", "trie", "data-structure", "ttl"]
categories = ["data-structures"]

[dependencies]
bytes.workspace = true
smallvec.workspace = true
ordered-float = "5.1.0"
monoio.workspace = true
# path le temps du chantier save (copy_occupancy), repasser en version publiée ensuite
hislab = { path = "../../hislab", features = ["rand"] }
radixox-lib = { workspace = true }
valart = { path = "../valart" }
mimalloc = { workspace = true }
libmimalloc-sys = { workspace = true }

rand = "0.8"
crc32fast = "1.4"
regex-automata = { version = "0.4", optional = true, default-features = false, features = [
    "dfa-build",
    "dfa-search",
    "syntax",
] }
thin-vec = "0.2.14"
hashbrown = "0.17.0"

[features]
regex = ["dep:regex-automata"]
