[package]
name = "oxidart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory ordered key-value engine: adaptive radix tree with TTL, prefix/range/glob queries, Redis value types and fork-free snapshots"
readme = "README.md"
keywords = ["art", "radix-tree", "trie", "data-structure", "ttl"]
categories = ["data-structures"]

[dependencies]
bytes.workspace = true
smallvec.workspace = true
ordered-float = "5.1.0"
zmij = "1.0"
hislab = { version = "0.2.5", features = ["rand"] }
radixox-lib = { workspace = true }
valart = { workspace = true }

rand = "0.8"
crc32fast = "1.4"
regex-automata = { version = "0.4", optional = true, default-features = false, features = [
    "dfa-build",
    "dfa-search",
    "syntax",
] }
thin-vec = "0.2.14"
hashbrown = "0.17.0"
zstd-safe = { version = "8.1", default-features = false, features = ["experimental", "std"] }

[features]
regex = ["dep:regex-automata"]

[dev-dependencies]
# Ancien arbre, oracle des tests différentiels (retiré à la publication).
oxidart-legacy = { path = "../oxidart-legacy", features = ["regex"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(radixox_nopool)', 'cfg(radixox_sysalloc)', 'cfg(radixox_list128)', 'cfg(radixox_list512)'] }
