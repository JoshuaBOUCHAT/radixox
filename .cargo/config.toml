[build]
rustflags = ["-C", "target-cpu=native"]

[env]
RUST_TEST_THREADS = "1"
# zstd (C, crate cc) sans protection de pile : le canari se lit dans `%fs` (TLS), que le
# binaire sans libc n'installe pas, et `__stack_chk_fail` n'existe pas sans libc
# (NOSTD_PLAN.md, étape 3). Vaut aussi pour le binaire glibc.
CFLAGS_x86_64_unknown_linux_gnu = "-fno-stack-protector"
