[package]
name = "valart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compact radix trees for the Hash and Set values of OxidArt / RadixOx"
readme = "README.md"
keywords = ["radix-tree", "hash", "set", "data-structure"]
categories = ["data-structures"]

[features]
# Processus `std` (défaut) ; sans elle, valart est `no_std` + `alloc`.
default = ["std"]
std = ["radixox-lib/std", "foldhash/std"]

[dependencies]
radixox-lib = { workspace = true }
foldhash = { version = "0.2", default-features = false }

[dev-dependencies]
fastrand = "2"
