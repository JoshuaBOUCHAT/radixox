[package]
name = "radixox-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RESP2/RESP3 protocol types and frame parsing for Redis-compatible servers"
keywords = ["redis", "resp", "protocol", "bytes", "server"]
categories = ["network-programming", "parser-implementations"]

[features]
# Compteur d'accès dans l'octet `lfu` des valeurs (LRU / LFU de `maxmemory`, MEMORY_ARCH.md
# §10.2 bis) : une écriture par lecture. Sans elle, rien n'est écrit à la lecture.
eviction = []
# Processus `std` (défaut) ; sans elle, la crate est `no_std` + `alloc` (lib.rs).
default = ["std"]
std = ["rustix/std", "dep:libc"]

[dependencies]
# Appels système directs (sans libc) : mémoire, horloge, fichiers, getrandom, stderr.
rustix = { version = "1.1", default-features = false, features = ["mm", "rand", "stdio", "fs", "time", "process"] }
# Appels directs absents de rustix (mincore, exit_group).
sc = "0.2"
# Seulement là où notre `malloc` exporté tient le rôle de la libc (`errno`), sous `std`.
libc = { version = "0.2", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(radixox_sysalloc)', 'cfg(radixox_nopool)', 'cfg(radixox_gc_debug)'] }
