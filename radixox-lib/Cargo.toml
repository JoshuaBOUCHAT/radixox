[package]
name = "radixox-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RESP2/RESP3 protocol types and frame parsing for Redis-compatible servers"
keywords = ["redis", "resp", "protocol", "bytes", "server"]
categories = ["network-programming", "parser-implementations"]

[features]
# Compteur d'accès dans l'octet `lfu` des valeurs (LRU / LFU de `maxmemory`, MEMORY_ARCH.md
# §10.2 bis) : une écriture par lecture. Sans elle, rien n'est écrit à la lecture.
eviction = []

[dependencies]
# Appels système directs (sans libc) : mémoire, getrandom, stderr. `libc` ne reste que là où
# notre allocateur tient le rôle de la libc (errno de malloc, getenv avant std) et pour mincore.
rustix = { version = "1.1", default-features = false, features = ["std", "mm", "rand", "stdio"] }
libc = "0.2"
# Appel direct pour mincore, absent de rustix.
sc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(radixox_sysalloc)', 'cfg(radixox_nopool)', 'cfg(radixox_gc_debug)'] }
